# Ajouté au Deployment par `kubectl patch deployment orders --patch-file k8s/readiness-patch.yaml`.
# Le Service n'envoie du trafic au pod que lorsque Spring Boot se déclare prêt.
spec:
  template:
    spec:
      containers:
        - name: orders
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 2
