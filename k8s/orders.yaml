apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
data:
  APP_MESSAGE: Bonjour
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
  SPRING_DATASOURCE_USERNAME: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: orders:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: orders-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests:
              memory: 384Mi
              cpu: 250m
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector:
    app: orders
  ports:
    - port: 80
      targetPort: 8080
